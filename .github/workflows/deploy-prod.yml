name: Deploy prod

# `prod` is the release branch and this workflow is the only thing that deploys it: lint, typecheck and the test
# suites run first, so nothing reaches Railway that CI would have rejected on main.
#
# One trigger ships both halves. Railway's build command is `pnpm railway:build`
# (= `convex deploy --cmd 'pnpm build'`), so the Convex backend is deployed and the frontend is built against it
# inside the same build — a frontend can never go live ahead of the schema it needs.
on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

# Never two prod deploys at once, and never cancel one halfway: an interrupted `railway up` leaves a build running
# on Railway that this workflow is no longer watching.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # A workspace token, so every Railway call names the project explicitly.
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY: --project 57432cb5-dc43-49c7-bf03-cc3908378927 --environment production --service usertrack
      HEALTH_URL: https://usertrack-production.up.railway.app/api/health
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The gate. `pnpm build` is deliberately not repeated here — Railway runs it, and a build that fails there
      # fails the deploy without ever swapping the running container.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm packages:build && pnpm packages:typecheck && pnpm packages:test

      # A revoked or rotated token would otherwise surface as an opaque 401 halfway through a release.
      - name: Railway token missing
        if: env.RAILWAY_API_TOKEN == ''
        run: |
          echo "::error title=No Railway token::Mint a workspace token at https://railway.com/account/tokens and run: gh secret set RAILWAY_API_TOKEN --repo The-CodeCave/UserTrack"
          exit 1

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5

      # `railway up` uploads the checked-out tree, so Railway's own RAILWAY_GIT_* variables are not populated and
      # /api/health would report "dev". The commit is passed explicitly instead, which is also what the poll below
      # waits for — the deploy is only green once the new build is the one answering.
      - name: Deploy
        run: |
          railway variable set "NEXT_PUBLIC_APP_VERSION=${GITHUB_SHA::7}" $RAILWAY --skip-deploys
          railway up --ci $RAILWAY

      - name: Wait for the new build to answer
        run: |
          for i in $(seq 1 40); do
            VERSION=$(curl -fsS --max-time 10 "$HEALTH_URL" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || echo "")
            if [ "$VERSION" = "${GITHUB_SHA::7}" ]; then
              echo "live: $VERSION"
              echo "### Deployed \`${GITHUB_SHA::7}\` — <https://usertrack-production.up.railway.app>" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i: serving '${VERSION:-unreachable}', waiting for ${GITHUB_SHA::7}"
            sleep 15
          done
          echo "::error title=Rollout not confirmed::The build finished but /api/health never reported ${GITHUB_SHA::7}."
          exit 1

name: CI

# Everything the ticket checklist runs locally: lint, typecheck, tests, the workspace packages and a production build.
# No secrets: the build only needs public placeholder URLs, and `convex/_generated` is committed.
on:
  push:
    # `prod` runs the same checks inside deploy-prod.yml, which then deploys; running them twice on one push
    # would only race for the same concurrency slot.
    branches-ignore: [prod]
    paths-ignore: ["apps/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["apps/**", "docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` — pnpm/action-setup reads the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm packages:build && pnpm packages:typecheck && pnpm packages:test
      - name: Build
        # Placeholders only: public pages render their degraded state when Convex is unreachable (OPS-3).
        env:
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://ci-placeholder.convex.site
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm build
